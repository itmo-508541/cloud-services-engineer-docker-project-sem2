name: docker-project

services:
    frontend:
        image: ${DOCKER_USER:-dev}/docker-project-frontend:latest
        ports:
            - "80:80"
        configs:
            - source: default.conf
              target: /etc/nginx/conf.d/default.conf
        healthcheck:
            test: ["CMD-SHELL", "nginx -t || exit 1"]
            interval: 30s
            timeout: 5s
            start_period: 5s
            retries: 5

    backend:
        image: ${DOCKER_USER:-dev}/docker-project-backend:latest
        expose:
            - "8081"
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/health || exit 1"]
            interval: 30s
            timeout: 5s
            start_period: 5s
            retries: 5

configs:
    default.conf:
        content: |
            server {
                listen 80;
                server_name _;

                location /api/ {
                    proxy_pass http://backend:8081/;
                }


                location / {
                    root /srv;
                    try_files $$uri $$uri/ /index.html;
                }
            }
