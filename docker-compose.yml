name: docker-project

services:
    frontend:
        image: ${DOCKER_USER:-dev}/docker-project-frontend:latest
        ports:
            - "80:80"
        configs:
            - source: default.conf
              target: /etc/nginx/conf.d/default.conf

    backend:
        image: ${DOCKER_USER:-dev}/docker-project-backend:latest
        expose:
            - "8081"

configs:
    default.conf:
        content: |
            server {
                listen 80;
                server_name _;

                location /api/ {
                    proxy_pass http://backend:8081/;
                }


                location / {
                    root /srv;
                    try_files $$uri $$uri/ /index.html;
                }
            }
