services:
    frontend:
        build:
            context: ./frontend
        ports:
            - "80:80"
        configs:
            - source: default.conf
              target: /etc/nginx/conf.d/default.conf

    backend:
        build:
            context: ./backend
        expose:
            - "8081"

configs:
    default.conf:
        content: |
            server {
                listen 80;
                server_name _;

                location /products {
                    proxy_pass http://backend:8081/products;
                }

                location /categories {
                    proxy_pass http://backend:8081/categories;
                }

                location /orders {
                    proxy_pass http://backend:8081/orders;
                }

                location /auth {
                    proxy_pass http://backend:8081/auth;
                }

                location /health {
                    proxy_pass http://backend:8081/health;
                }

                location /metrics {
                    proxy_pass http://backend:8081/metrics;
                }

                location / {
                    root /srv;
                    try_files $$uri $$uri/ /index.html;
                }
            }
