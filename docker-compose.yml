name: docker-project

services:
    frontend:
        image: ${DOCKER_USER:-itmo508541}/docker-project-frontend:latest
        restart: unless-stopped
        ports:
            - "80:80"
        networks:
            - application-network
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
        depends_on:
            backend:
                condition: service_healthy
        deploy:
            resources:
                limits:
                    cpus: "1"
                    memory: "256M"
        healthcheck:
            test: ["CMD-SHELL", "nginx -t || exit 1"]
            interval: 30s
            timeout: 5s
            start_period: 5s
            retries: 5
        read_only: true
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        tmpfs:
            - /tmp:rw,noexec,nosuid,size=128M
            - /var/cache/nginx/client_temp:rw,noexec,nosuid,size=256M
            - /var/cache/nginx/proxy_temp:rw,noexec,nosuid,size=256M
            - /var/cache/nginx/fastcgi_temp:rw,noexec,nosuid,size=256M
            - /var/cache/nginx/uwsgi_temp:rw,noexec,nosuid,size=256M
            - /var/cache/nginx/scgi_temp:rw,noexec,nosuid,size=256M

    backend:
        image: ${DOCKER_USER:-itmo508541}/docker-project-backend:latest
        restart: unless-stopped
        expose:
            - "8081"
        networks:
            - application-network
        deploy:
            resources:
                limits:
                    cpus: "1"
                    memory: "256M"
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/health || exit 1"]
            interval: 30s
            timeout: 5s
            start_period: 5s
            retries: 5
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true

networks:
  application-network:
    driver: bridge
