name: docker-project

services:
    frontend:
        image: ${DOCKER_USER:-itmo508541}/docker-project-frontend:latest
        restart: unless-stopped
        ports:
            - "80:80"
        configs:
            - source: nginx.conf
              target: /etc/nginx/nginx.conf
        depends_on:
            backend:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "nginx -t || exit 1"]
            interval: 30s
            timeout: 5s
            start_period: 5s
            retries: 5

    backend:
        image: ${DOCKER_USER:-itmo508541}/docker-project-backend:latest
        restart: unless-stopped
        expose:
            - "8081"
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/health || exit 1"]
            interval: 30s
            timeout: 5s
            start_period: 5s
            retries: 5

configs:
    nginx.conf:
        file: nginx.conf
