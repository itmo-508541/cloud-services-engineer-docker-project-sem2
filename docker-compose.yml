name: docker-project

services:
    frontend:
        image: ${DOCKER_USER:-itmo508541}/docker-project-frontend:latest
        restart: unless-stopped
        ports:
            - "80:80"
        configs:
            - source: default.conf
              target: /etc/nginx/conf.d/default.conf
        depends_on:
            backend:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "nginx -t || exit 1"]
            interval: 30s
            timeout: 5s
            start_period: 5s
            retries: 5

    backend:
        image: ${DOCKER_USER:-itmo508541}/docker-project-backend:latest
        restart: unless-stopped
        expose:
            - "8081"
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/health || exit 1"]
            interval: 30s
            timeout: 5s
            start_period: 5s
            retries: 5

configs:
    default.conf:
        content: |
            resolver 127.0.0.11 valid=10s ipv6=off;

            upstream backend {
                zone backend_upstreams 64k;
                server backend:8081 resolve;
            }

            server {
                listen 80;
                server_name _;

                location /api/ {
                    proxy_pass http://backend/;
                }

                location / {
                    root /srv;
                    try_files $$uri $$uri/ /index.html;
                }
            }
